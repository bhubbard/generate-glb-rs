[package]
name = "generate-glb"
version = "1.1.0"
edition = "2021"
authors = ["Steven Castellotti <https://github.com/castellotti>", "Brandon Hubbard <bkhubbard@gmail.com>", "generate-glb contributors"]
license = "MIT"
description = "Fast, pure Rust CLI and server for generating 3D models in GLB format using LLaMA-Mesh AI"
repository = "https://github.com/bhubbard/generate-glb-rs"
homepage = "https://github.com/bhubbard/generate-glb-rs"
readme = "README.md"
keywords = ["3d", "glb", "gltf", "mesh", "ai"]
categories = ["graphics", "command-line-utilities", "multimedia"]

[lib]
name = "generate_glb"
path = "src/lib.rs"

[[bin]]
name = "generate-glb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
byteorder = "1.5"
colored = "3.0"
indicatif = "0.17"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3.17"
